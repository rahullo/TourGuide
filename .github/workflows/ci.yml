name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run linter
      run: npm run lint
      
    - name: Build the app
      run: npm run build
      env:
        # We supply dummy values for CI since we don't have the real DB string
        MONGODB_URI: "mongodb://localhost:27017/tourguide-ci"
        NEXTAUTH_SECRET: "dummy_secret_for_ci_build"
        NEXTAUTH_URL: "http://localhost:3000"
